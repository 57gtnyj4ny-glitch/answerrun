<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f2eb">
	<title>День за днём — план на сегодня</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
		:root {
			color-scheme: light;
			--paper: #f4f2eb; --ink: #22251f; --muted: #777a70; --line: #deded3;
			--green: #416b50; --green-dark: #31543e; --lime: #d8ed9b; --coral: #e98369; --white: #fffefa;
			font-family: 'DM Sans', sans-serif; font-synthesis: none; text-rendering: optimizeLegibility;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh; color: var(--ink); background-color: var(--paper);
			background-image: radial-gradient(#d5d3c8 0.65px, transparent 0.65px); background-size: 13px 13px;
		}
		button, input { font: inherit; }
		button { color: inherit; }
		.page {
			width: min(100% - 48px, 1080px); min-height: 100vh; margin: 0 auto; display: grid;
			grid-template-columns: minmax(240px, 0.82fr) minmax(400px, 1.18fr); align-items: center;
			gap: clamp(40px, 9vw, 128px); padding: 64px 0;
		}
		.intro { align-self: center; animation: rise-in 650ms ease both; }
		.wordmark { display: flex; align-items: center; gap: 10px; margin-bottom: 86px; font-size: 14px; font-weight: 700; }
		.mark {
			display: grid; width: 30px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: var(--green);
			color: var(--lime); font-family: 'Manrope', sans-serif; font-size: 17px;
		}
		.eyebrow { margin: 0 0 16px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
		h1, h2, p { margin-top: 0; }
		h1 {
			max-width: 420px; margin-bottom: 20px; font-family: 'Manrope', sans-serif;
			font-size: clamp(42px, 5vw, 66px); font-weight: 600; line-height: 1.04;
		}
		h1 span { color: var(--green); }
		.intro-copy { max-width: 340px; margin-bottom: 35px; color: var(--muted); font-size: 15px; line-height: 1.7; }
		.date-line { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
		.date-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
		.planner {
			overflow: hidden; border: 1px solid #e6e4da; border-radius: 8px; background: var(--white);
			box-shadow: 0 24px 70px #393b2712, 0 3px 9px #393b270a; animation: rise-in 650ms 100ms ease both;
		}
		.planner-head { padding: 29px 30px 0; }
		.planner-kicker { margin: 0 0 6px; color: var(--muted); font-size: 12px; }
		.planner-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
		h2 { margin-bottom: 22px; font-family: 'Manrope', sans-serif; font-size: 25px; font-weight: 700; }
		.count { color: var(--muted); font-size: 12px; white-space: nowrap; }
		.progress-track { height: 4px; overflow: hidden; border-radius: 4px; background: #e9e9df; }
		.progress-bar { width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width 220ms ease; }
		.add-form {
			display: grid; grid-template-columns: 112px minmax(0, 1fr) 47px;
			grid-template-areas: "priority task submit" "due due due" "repeat repeat repeat"; align-items: center; gap: 9px; padding: 23px 30px 20px;
		}
		.task-input {
			grid-area: task; width: 100%; min-width: 0; height: 47px; padding: 0 15px; border: 1px solid var(--line); border-radius: 5px;
			outline: none; background: #fff; color: var(--ink); font-size: 13px; transition: border-color 160ms ease, box-shadow 160ms ease;
		}
		.task-input::placeholder { color: #a1a297; }
		.task-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px #416b5018; }
		.priority-select {
			grid-area: priority; width: 112px; min-width: 90px; height: 47px; padding: 0 10px; border: 1px solid var(--line);
			border-radius: 5px; outline: none; background: #fff; color: var(--ink); font-size: 12px;
		}
		.priority-select:focus { border-color: var(--green); box-shadow: 0 0 0 3px #416b5018; }
		.due-date-control { grid-area: due; display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; }
		.due-date-input { width: 160px; height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; }
		.due-date-input:focus { border-color: var(--green); outline: 2px solid #416b5018; }
		.repeat-control { grid-area: repeat; display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; }
		.repeat-select { width: 160px; height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; }
		.repeat-select:focus { border-color: var(--green); outline: 2px solid #416b5018; }
		.add-button {
			grid-area: submit; display: grid; width: 47px; min-width: 47px; height: 47px; place-items: center; border: 0; border-radius: 5px;
			background: var(--green); color: white; cursor: pointer; transition: background 150ms ease, transform 150ms ease;
		}
		.add-button:hover { background: var(--green-dark); }
		.add-button:active { transform: scale(0.96); }
		.add-button svg { width: 19px; height: 19px; }
		.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 30px 13px; }
		.filters { display: flex; gap: 5px; }
		.filter-button, .clear-button { border: 0; background: transparent; cursor: pointer; font-size: 11px; transition: color 140ms ease, background 140ms ease; }
		.filter-button { padding: 7px 9px; border-radius: 4px; color: var(--muted); }
		.filter-button:hover { background: #f1f2ec; color: var(--ink); }
		.filter-button[aria-pressed="true"] { background: #e9eee5; color: var(--green-dark); font-weight: 700; }
		.clear-button { padding: 7px 0 7px 8px; color: #9a7065; }
		.clear-button:hover { color: #a84e3b; }
		.clear-button:disabled { color: #c7c4ba; cursor: default; }
		.task-list { min-height: 202px; max-height: 390px; overflow-y: auto; margin: 0; padding: 0 30px; list-style: none; }
		.task-item { display: flex; min-height: 55px; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid #eeede6; animation: task-in 220ms ease both; }
		.task-check {
			position: relative; display: grid; width: 19px; min-width: 19px; height: 19px; place-items: center; padding: 0;
			border: 1.5px solid #c8c9bd; border-radius: 50%; background: transparent; cursor: pointer; transition: border-color 150ms ease, background 150ms ease;
		}
		.task-check:hover { border-color: var(--green); }
		.task-item.is-done .task-check { border-color: var(--green); background: var(--green); color: white; }
		.task-check svg { width: 11px; height: 11px; }
		.task-content { display: grid; flex: 1; min-width: 0; align-content: center; gap: 5px; }
		.task-text { min-width: 0; overflow-wrap: anywhere; color: #41443c; font-size: 13px; line-height: 1.45; transition: color 150ms ease; }
		.task-item.is-done .task-text { color: #a6a79d; text-decoration: line-through; text-decoration-color: #b9bbb0; }
		.task-meta { display: flex; min-width: 0; align-items: center; flex-wrap: wrap; gap: 6px; }
		.task-priority { flex: none; padding: 4px 7px; border-radius: 3px; font-size: 10px; white-space: nowrap; }
		.priority-high { background: #f9e9e4; color: #a84e3b; }
		.priority-normal { background: #e9eee5; color: var(--green-dark); }
		.priority-low { background: #f0f0e9; color: var(--muted); }
		.task-repeat { flex: none; padding: 4px 7px; border-radius: 3px; background: #eef1e6; color: var(--green-dark); font-size: 10px; white-space: nowrap; }
		.task-due { flex: none; color: var(--muted); font-size: 10px; white-space: nowrap; }
		.task-due.is-overdue { color: #b6533e; font-weight: 700; }
		.edit-button, .delete-button {
			display: grid; width: 30px; height: 30px; min-width: 30px; place-items: center; border: 0; border-radius: 4px;
			background: transparent; color: #b1b1a7; cursor: pointer; opacity: 0; transition: opacity 140ms ease, color 140ms ease, background 140ms ease;
		}
		.task-item:hover .edit-button, .task-item:hover .delete-button, .edit-button:focus-visible, .delete-button:focus-visible { opacity: 1; }
		.edit-button:hover { background: #eef1e6; color: var(--green-dark); }
		.delete-button:hover { background: #f9e9e4; color: #b6533e; }
		.edit-button svg, .delete-button svg { width: 15px; height: 15px; }
		.edit-dialog { width: min(100% - 32px, 420px); padding: 0; border: 1px solid #e6e4da; border-radius: 8px; background: var(--white); color: var(--ink); box-shadow: 0 24px 70px #22251f33; }
		.edit-dialog::backdrop { background: #22251f88; backdrop-filter: blur(2px); }
		.edit-dialog-form { display: grid; gap: 17px; padding: 25px; }
				.edit-dialog-title { margin: 0 0 2px; font-family: 'Manrope', sans-serif; font-size: 22px; }
				.edit-field { display: grid; gap: 7px; color: var(--muted); font-size: 12px; }
				.edit-field input, .edit-field select { width: 100%; height: 42px; padding: 0 11px; border: 1px solid var(--line); border-radius: 4px; outline: none; background: white; color: var(--ink); font: inherit; font-size: 13px; }
				.edit-field input:focus, .edit-field select:focus { border-color: var(--green); box-shadow: 0 0 0 3px #416b5018; }
				.edit-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 2px; }
				.edit-cancel, .edit-save { min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 12px; }
				.edit-cancel { background: transparent; color: var(--muted); }
				.edit-save { border-color: var(--green); background: var(--green); color: white; }
				.edit-save:hover { background: var(--green-dark); }
		.empty-state { display: grid; min-height: 202px; place-content: center; justify-items: center; gap: 9px; color: var(--muted); text-align: center; }
		.empty-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: #eef1e6; color: var(--green); font-family: 'Manrope', sans-serif; font-size: 18px; }
		.empty-state p { margin: 0; font-size: 12px; }
		.planner-foot { display: flex; min-height: 46px; align-items: center; justify-content: space-between; gap: 10px; padding: 0 30px; border-top: 1px solid #eeede6; color: #929389; font-size: 10px; }
		.foot-note { display: flex; align-items: center; gap: 6px; }
		.foot-note svg { width: 13px; height: 13px; color: var(--green); }
		@keyframes rise-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes task-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 760px) {
			.page { width: min(100% - 36px, 540px); grid-template-columns: 1fr; align-content: start; gap: 33px; padding: 34px 0 48px; }
			.wordmark { margin-bottom: 40px; }
			h1 { max-width: 500px; font-size: clamp(43px, 11vw, 58px); }
			.intro-copy { margin-bottom: 18px; }
		}
		@media (max-width: 430px) {
			.page { width: calc(100% - 28px); }
			.planner-head { padding: 24px 20px 0; }
			.add-form { padding: 20px 20px 17px; }
			.toolbar { padding: 0 20px 12px; }
			.task-list { padding: 0 20px; }
			.planner-foot { padding: 0 20px; }
			.filter-button { padding: 7px; }
			.add-form { grid-template-columns: 94px minmax(0, 1fr) 42px; }
			.priority-select { width: 94px; min-width: 88px; padding: 0 7px; }
			.add-button { width: 42px; min-width: 42px; }
			.edit-button, .delete-button { opacity: 1; }
		}
		@media (max-width: 360px) {
			.page { width: calc(100% - 20px); }
			.planner-head { padding: 20px 16px 0; }
			.planner-title-row { align-items: flex-start; flex-direction: column; gap: 0; }
			h2 { margin-bottom: 9px; font-size: 21px; }
			.add-form { grid-template-columns: minmax(0, 1fr) 42px; grid-template-areas: "task submit" "priority priority" "due due" "repeat repeat"; }
			.priority-select { width: 160px; min-width: 0; }
			.toolbar { flex-wrap: wrap; }
			.task-list { padding: 0 16px; }
			.planner-foot { flex-wrap: wrap; padding: 8px 16px; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="page">
		<section class="intro" aria-labelledby="page-title">
			<div class="wordmark"><span class="mark" aria-hidden="true">д</span> день за днём</div>
			<p class="eyebrow">Небольшой планировщик</p>
			<h1 id="page-title">Спокойно.<br><span>По порядку.</span></h1>
			<p class="intro-copy">Запиши главное, освободи голову и двигайся в своём темпе. Один небольшой шаг тоже считается.</p>
			<div class="date-line"><span class="date-dot" aria-hidden="true"></span><span id="today-date"></span></div>
		</section>

		<section class="planner" aria-labelledby="planner-title">
			<header class="planner-head">
				<p class="planner-kicker">Твой фокус</p>
				<div class="planner-title-row">
					<h2 id="planner-title">Задачи на день</h2>
					<span class="count" id="task-count" aria-live="polite"></span>
				</div>
				<div class="progress-track" role="progressbar" aria-label="Выполненные задачи" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-bar" id="progress-bar"></div></div>
			</header>
			<form class="add-form" id="add-form">
				<select class="priority-select" id="priority-input" aria-label="Приоритет новой задачи">
					<option value="normal">Обычная</option>
					<option value="high">Срочная</option>
					<option value="low">Низкий приоритет</option>
				</select>
				<input class="task-input" id="task-input" type="text" maxlength="140" placeholder="Что важно сделать?" autocomplete="off" aria-label="Новая задача">
				<button class="add-button" type="submit" aria-label="Добавить задачу" title="Добавить задачу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
				<label class="due-date-control" for="due-date-input">Срок <input class="due-date-input" id="due-date-input" type="date" aria-label="Срок выполнения"></label>
				<label class="repeat-control" for="repeat-input">Повтор
					<select class="repeat-select" id="repeat-input" aria-label="Повторение задачи">
						<option value="none">Не повторять</option>
						<option value="daily">Каждый день</option>
					</select>
				</label>
			</form>
			<div class="toolbar">
				<div class="filters" role="group" aria-label="Фильтр задач">
					<button class="filter-button" type="button" data-filter="all" aria-pressed="true">Все</button>
					<button class="filter-button" type="button" data-filter="active" aria-pressed="false">Активные</button>
					<button class="filter-button" type="button" data-filter="done" aria-pressed="false">Готово</button>
				</div>
				<button class="clear-button" id="clear-completed" type="button">Очистить готовые</button>
			</div>
			<ul class="task-list" id="task-list" aria-label="Список задач"></ul>
			<footer class="planner-foot">
				<span class="foot-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.4 2.9 7.5 7 10 4.1-2.5 7-5.6 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>Сохраняется только на этом устройстве</span>
				<span id="remaining-count"></span>
			</footer>
		</section>
	</main>
	<dialog class="edit-dialog" id="edit-dialog" aria-labelledby="edit-dialog-title">
		<form class="edit-dialog-form" id="edit-form">
			<h2 class="edit-dialog-title" id="edit-dialog-title">Изменить задачу</h2>
			<label class="edit-field">Название<input id="edit-text" type="text" maxlength="140" required></label>
			<label class="edit-field">Приоритет
				<select id="edit-priority">
					<option value="normal">Обычная</option>
					<option value="high">Срочная</option>
					<option value="low">Низкий приоритет</option>
				</select>
			</label>
			<label class="edit-field">Срок<input id="edit-due-date" type="date"></label>
			<label class="edit-field">Повторение
				<select id="edit-repeat">
					<option value="none">Не повторять</option>
					<option value="daily">Каждый день</option>
				</select>
			</label>
			<div class="edit-actions">
				<button class="edit-cancel" id="cancel-edit" type="button">Отмена</button>
				<button class="edit-save" type="submit">Сохранить</button>
			</div>
		</form>
	</dialog>
	<script>
		const storageKey = 'den-za-dnem-tasks-v1';
		const taskList = document.querySelector('#task-list');
		const taskInput = document.querySelector('#task-input');
		const priorityInput = document.querySelector('#priority-input');
		const dueDateInput = document.querySelector('#due-date-input');
		const repeatInput = document.querySelector('#repeat-input');
		const editDialog = document.querySelector('#edit-dialog');
		const editForm = document.querySelector('#edit-form');
		const editText = document.querySelector('#edit-text');
		const editPriority = document.querySelector('#edit-priority');
		const editDueDate = document.querySelector('#edit-due-date');
		const editRepeat = document.querySelector('#edit-repeat');
		const countLabel = document.querySelector('#task-count');
		const remainingLabel = document.querySelector('#remaining-count');
		const progressBar = document.querySelector('#progress-bar');
		const progressTrack = document.querySelector('.progress-track');
		const clearButton = document.querySelector('#clear-completed');
		const filters = document.querySelector('.filters');
		let activeFilter = 'all';
		let currentDay = localDateKey(new Date());
		let editingTask = null;
		let tasks = loadTasks();

		function isValidDate(value) {
			return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(Date.parse(`${value}T00:00:00`)) && new Date(value).toISOString().slice(0, 10) === value;
		}

		function localDateKey(date) {
			return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
		}

		function formatDueDate(value) {
			if (!value) return null;
			const today = localDateKey(new Date());
			const tomorrow = new Date();
			tomorrow.setDate(tomorrow.getDate() + 1);
			const date = new Date(`${value}T00:00:00`);
			const formatted = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' }).format(date);
			const overdue = value < today;
			return {
				label: overdue ? `Просрочено · ${formatted}` : value === today ? 'Сегодня' : value === localDateKey(tomorrow) ? 'Завтра' : formatted,
				overdue,
				full: new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).format(date)
			};
		}

		function loadTasks() {
			try {
				const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
				const today = localDateKey(new Date());
				return Array.isArray(saved) ? saved
					.filter((task) => task && typeof task.id === 'string' && typeof task.text === 'string' && typeof task.done === 'boolean')
					.map((task) => {
						const repeat = task.repeat === 'daily' ? 'daily' : 'none';
						const completedDate = isValidDate(task.completedDate) ? task.completedDate : '';
						let dueDate = isValidDate(task.dueDate) ? task.dueDate : '';
						if (repeat === 'daily' && dueDate && dueDate < today) dueDate = today;
						return {
							...task,
							done: repeat === 'daily' && task.done && completedDate !== today ? false : task.done,
							priority: ['high', 'normal', 'low'].includes(task.priority) ? task.priority : 'normal',
							dueDate,
							repeat,
							completedDate
						};
					}) : [];
			} catch {
				return [];
			}
		}

		function saveTasks() {
			try {
				localStorage.setItem(storageKey, JSON.stringify(tasks));
			} catch {
				remainingLabel.textContent = 'Не удалось сохранить';
			}
		}

		function refreshDailyTasks() {
			const today = localDateKey(new Date());
			if (today === currentDay) return;
			currentDay = today;
			let changed = false;
			tasks.forEach((task) => {
				if (task.repeat !== 'daily') return;
				if (task.done && task.completedDate !== today) {
					task.done = false;
					changed = true;
				}
				if (task.dueDate && task.dueDate < today) {
					task.dueDate = today;
					changed = true;
				}
			});
			if (changed) {
				saveTasks();
				render();
			}
		}

		function icon(name) {
			if (name === 'check') return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 3.2 3.2L13 4.5"/></svg>';
			if (name === 'edit') return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.8 4.2 3 3M4 16l3.5-.7L16 6.8a1.6 1.6 0 0 0-2.3-2.3l-8.5 8.5L4 16Z"/></svg>';
			return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2m2 0-.7 10H6.7L6 6m2.5 3v4m3-4v4"/></svg>';
		}

		function editTask(task) {
			editingTask = task;
			editText.value = task.text;
			editPriority.value = task.priority;
			editDueDate.value = task.dueDate;
			editRepeat.value = task.repeat;
			editDialog.showModal();
			editText.focus();
		}

		function render() {
			const priorityRank = { high: 2, normal: 1, low: 0 };
			const priorityLabels = { high: 'Срочная', normal: 'Обычная', low: 'Низкий приоритет' };
			const visibleTasks = tasks
				.filter((task) => activeFilter === 'all' || (activeFilter === 'active' && !task.done) || (activeFilter === 'done' && task.done))
				.sort((left, right) => Number(left.done) - Number(right.done) || priorityRank[right.priority] - priorityRank[left.priority] || (left.dueDate || '9999').localeCompare(right.dueDate || '9999'));
			taskList.replaceChildren();
			if (visibleTasks.length === 0) {
				const empty = document.createElement('li');
				empty.className = 'empty-state';
				const mark = document.createElement('span');
				mark.className = 'empty-mark';
				mark.setAttribute('aria-hidden', 'true');
				mark.textContent = activeFilter === 'done' ? '✓' : '·';
				const message = document.createElement('p');
				message.textContent = activeFilter === 'done' ? 'Здесь появятся выполненные задачи' : activeFilter === 'active' ? 'Все задачи выполнены. Хорошая работа!' : 'Пока тихо. Добавь первую задачу';
				empty.append(mark, message);
				taskList.append(empty);
			} else {
				visibleTasks.forEach((task) => {
					const item = document.createElement('li');
					item.className = `task-item${task.done ? ' is-done' : ''}`;
					const toggle = document.createElement('button');
					toggle.className = 'task-check';
					toggle.type = 'button';
					toggle.setAttribute('aria-label', task.done ? `Отметить «${task.text}» невыполненной` : `Отметить «${task.text}» выполненной`);
					toggle.setAttribute('aria-pressed', String(task.done));
					if (task.done) toggle.innerHTML = icon('check');
					const text = document.createElement('span');
					text.className = 'task-text';
					text.textContent = task.text;
					const content = document.createElement('div');
					content.className = 'task-content';
					const metadata = document.createElement('div');
					metadata.className = 'task-meta';
					content.append(text, metadata);
					const priority = document.createElement('span');
					priority.className = `task-priority priority-${task.priority}`;
					priority.textContent = priorityLabels[task.priority];
					metadata.append(priority);
					const dueDate = formatDueDate(task.dueDate);
					if (dueDate) {
						const dueLabel = document.createElement('span');
						dueLabel.className = `task-due${dueDate.overdue && !task.done ? ' is-overdue' : ''}`;
						dueLabel.textContent = dueDate.label;
						dueLabel.title = `Срок: ${dueDate.full}`;
						metadata.append(dueLabel);
					}
					if (task.repeat === 'daily') {
						const repeatLabel = document.createElement('span');
						repeatLabel.className = 'task-repeat';
						repeatLabel.textContent = 'Каждый день';
						metadata.append(repeatLabel);
					}
					const edit = document.createElement('button');
					edit.className = 'edit-button';
					edit.type = 'button';
					edit.setAttribute('aria-label', `Изменить задачу «${task.text}»`);
					edit.title = 'Изменить задачу';
					edit.innerHTML = icon('edit');
					const remove = document.createElement('button');
					remove.className = 'delete-button';
					remove.type = 'button';
					remove.setAttribute('aria-label', `Удалить задачу «${task.text}»`);
					remove.title = 'Удалить задачу';
					remove.innerHTML = icon('delete');
					edit.addEventListener('click', () => editTask(task));
					toggle.addEventListener('click', () => {
						task.done = !task.done;
						task.completedDate = task.repeat === 'daily' && task.done ? localDateKey(new Date()) : '';
						saveTasks();
						render();
					});
					remove.addEventListener('click', () => {
						tasks = tasks.filter((entry) => entry.id !== task.id);
						saveTasks();
						render();
					});
					item.append(toggle, content, edit, remove);
					taskList.append(item);
				});
			}
			const completed = tasks.filter((task) => task.done).length;
			const unfinished = tasks.length - completed;
			countLabel.textContent = `${completed} из ${tasks.length} готово`;
			remainingLabel.textContent = unfinished === 0 && tasks.length > 0 ? 'Всё сделано' : `Осталось: ${unfinished}`;
			clearButton.disabled = completed === 0;
			const progress = tasks.length === 0 ? 0 : Math.round((completed / tasks.length) * 100);
			progressBar.style.width = `${progress}%`;
			progressTrack.setAttribute('aria-valuenow', String(progress));
		}

		document.querySelector('#add-form').addEventListener('submit', (event) => {
			event.preventDefault();
			const text = taskInput.value.trim();
			if (!text) {
				taskInput.focus();
				return;
			}
			tasks.unshift({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, text, done: false, priority: priorityInput.value, dueDate: dueDateInput.value, repeat: repeatInput.value, completedDate: '' });
			activeFilter = 'all';
			filters.querySelectorAll('[data-filter]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.filter === activeFilter)));
			taskInput.value = '';
			priorityInput.value = 'normal';
			dueDateInput.value = '';
			repeatInput.value = 'none';
			saveTasks();
			render();
			taskInput.focus();
		});
		editForm.addEventListener('submit', (event) => {
			event.preventDefault();
			if (!editingTask) return;
			const text = editText.value.trim();
			if (!text) {
				editText.focus();
				return;
			}
			editingTask.text = text;
			editingTask.priority = editPriority.value;
			editingTask.dueDate = editDueDate.value;
			editingTask.repeat = editRepeat.value;
			editingTask.completedDate = editingTask.repeat === 'daily' && editingTask.done ? localDateKey(new Date()) : '';
			saveTasks();
			editingTask = null;
			editDialog.close();
			render();
		});

		document.querySelector('#cancel-edit').addEventListener('click', () => editDialog.close());
		editDialog.addEventListener('close', () => { editingTask = null; });
		document.addEventListener('visibilitychange', refreshDailyTasks);
		window.setInterval(refreshDailyTasks, 60_000);

		filters.addEventListener('click', (event) => {
			const button = event.target.closest('[data-filter]');
			if (!button) return;
			activeFilter = button.dataset.filter;
			filters.querySelectorAll('[data-filter]').forEach((filterButton) => filterButton.setAttribute('aria-pressed', String(filterButton === button)));
			render();
		});

		clearButton.addEventListener('click', () => {
			tasks = tasks.filter((task) => !task.done);
			saveTasks();
			render();
		});

		document.querySelector('#today-date').textContent = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
		render();
	</script>
</body>
</html>
